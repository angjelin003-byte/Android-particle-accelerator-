name: Build Android APK with Gradle & Kotlin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configure Gradle Environment & Cleanup Repositories
        run: |
          mkdir -p gradle/wrapper android/gradle/wrapper
          
          # Automatically downloads the missing gradle-wrapper.jar
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 8.5
          fi
          
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cp gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

          # Switch FAIL_ON_PROJECT_REPOS to PREFER_SETTINGS to prevent repository conflicts
          find . -name "settings.gradle*" -exec sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/g' {} +

          # Remove redundant allprojects repository blocks
          find . -name "build.gradle.kts" -exec sed -i '/allprojects[[:space:]]*{/,/^[[:space:]]*}/d' {} +
          find . -name "build.gradle" -exec sed -i '/allprojects[[:space:]]*{/,/^[[:space:]]*}/d' {} +

      - name: Build with Gradle & Kotlin
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f android/gradlew ] && [ -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cd android && ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_PATH=$(find . -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
