name: Build Android APK with Gradle & Kotlin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Resolve Conflicting Scripts & Setup Android Files
        shell: python
        run: |
          import os

          # 1. Delete all conflicting legacy Groovy files across the repository
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f in ('build.gradle', 'settings.gradle'):
                      filepath = os.path.join(root, f)
                      print(f"Removing conflicting file: {filepath}")
                      os.remove(filepath)

          # 2. Remove duplicate settings/build scripts in subdirectories
          for duplicate in ('android/settings.gradle.kts', 'android/build.gradle.kts'):
              if os.path.exists(duplicate):
                  print(f"Removing duplicate file: {duplicate}")
                  os.remove(duplicate)

          # 3. Write clean root settings.gradle.kts
          settings_kts = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RelativisticParticleCollider"
          include(":app")
          project(":app").projectDir = file("android/app")
          """
          with open("settings.gradle.kts", "w") as f:
              f.write(settings_kts)

          # 4. Write clean root build.gradle.kts
          root_build_kts = """buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.2.2")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22")
              }
          }
          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          """
          with open("build.gradle.kts", "w") as f:
              f.write(root_build_kts)

          # 5. Write clean android/app/build.gradle.kts
          os.makedirs("android/app", exist_ok=True)
          app_build_kts = """plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.relativistic.particlecollider"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.relativistic.particlecollider"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  debug {
                      isDebuggable = true
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                  }
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  viewBinding = false
              }

              sourceSets {
                  getByName("main") {
                      assets.srcDirs("src/main/assets")
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.webkit:webkit:1.10.0")
          }
          """
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(app_build_kts)

          # 6. Ensure proguard-rules.pro exists
          proguard_file = "android/app/proguard-rules.pro"
          if not os.path.exists(proguard_file):
              with open(proguard_file, "w") as f:
                  f.write("# Proguard rules\n")

          # 7. Write gradle.properties with AndroidX enabled
          props = "android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n"
          with open("gradle.properties", "w") as f:
              f.write(props)
          with open("android/gradle.properties", "w") as f:
              f.write(props)

          # 8. Ensure themes.xml defines Theme.ParticleCollider without shadowing AppCompat
          os.makedirs("android/app/src/main/res/values", exist_ok=True)
          themes_xml = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.ParticleCollider" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#07090E</item>
                  <item name="android:navigationBarColor">#07090E</item>
                  <item name="android:windowBackground">#07090E</item>
                  <item name="colorPrimary">#6366F1</item>
                  <item name="colorSecondary">#06B6D4</item>
              </style>
          </resources>
          """
          with open("android/app/src/main/res/values/themes.xml", "w") as f:
              f.write(themes_xml)

          # 9. Ensure AndroidManifest.xml uses Theme.ParticleCollider
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m_content = f.read()
              m_content = m_content.replace('android:theme="@style/Theme.AppCompat.NoActionBar"', 'android:theme="@style/Theme.ParticleCollider"')
              with open(manifest_path, "w") as f:
                  f.write(m_content)

          # 10. Ensure MainActivity.kt uses WebViewAssetLoader for modern ES Modules & WebGL
          main_activity_dir = "android/app/src/main/java/com/relativistic/particlecollider"
          os.makedirs(main_activity_dir, exist_ok=True)
          main_activity_kt = """package com.relativistic.particlecollider

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.util.Log
          import android.view.View
          import android.view.WindowInsetsController
          import android.webkit.ConsoleMessage
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.TextView
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : AppCompatActivity() {

              private var webView: WebView? = null
              private val TAG = "ParticleCollider"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  try {
                      window.statusBarColor = Color.parseColor("#07090E")
                      window.navigationBarColor = Color.parseColor("#07090E")
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          window.insetsController?.setSystemBarsAppearance(
                              0,
                              WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS or WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
                          )
                      }
                  } catch (e: Exception) {
                      Log.w(TAG, "Status bar config warning", e)
                  }

                  try {
                      val wv = WebView(this).apply {
                          setLayerType(View.LAYER_TYPE_HARDWARE, null)
                          setBackgroundColor(Color.parseColor("#07090E"))
                      }
                      webView = wv
                      setContentView(wv)

                      wv.settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          allowContentAccess = true
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          mediaPlaybackRequiresUserGesture = false
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      }

                      val assetLoader = WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this))
                          .build()

                      wv.webViewClient = object : WebViewClient() {
                          override fun shouldInterceptRequest(
                              view: WebView?,
                              request: WebResourceRequest?
                          ): WebResourceResponse? {
                              request?.url?.let { uri ->
                                  val response = assetLoader.shouldInterceptRequest(uri)
                                  if (response != null) return response
                              }
                              return super.shouldInterceptRequest(view, request)
                          }
                      }

                      wv.webChromeClient = object : WebChromeClient() {
                          override fun onConsoleMessage(consoleMessage: ConsoleMessage?): Boolean {
                              return super.onConsoleMessage(consoleMessage)
                          }
                      }

                      onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              if (wv.canGoBack()) {
                                  wv.goBack()
                              } else {
                                  finish()
                              }
                          }
                      })

                      wv.loadUrl("https://appassets.androidplatform.net/assets/index.html")

                  } catch (e: Throwable) {
                      Log.e(TAG, "WebView initialization error", e)
                      val errorView = TextView(this).apply {
                          text = "Failed to launch simulation engine: " + e.message
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor("#07090E"))
                          setPadding(50, 100, 50, 50)
                      }
                      setContentView(errorView)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  webView?.onResume()
              }

              override fun onPause() {
                  super.onPause()
                  webView?.onPause()
              }

              override fun onDestroy() {
                  webView?.destroy()
                  super.onDestroy()
              }
          }
          """
          # Clean leading whitespace from multiline template
          import textwrap
          with open(os.path.join(main_activity_dir, "MainActivity.kt"), "w") as f:
              f.write(textwrap.dedent(main_activity_kt))
          print("MainActivity.kt written with WebViewAssetLoader")

      - name: Ensure Wrapper Binary & Accept SDK Licenses
        run: |
          mkdir -p gradle/wrapper android/gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || true
          fi
          cp -f gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true

          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Android Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find-apk
        run: |
          APK_PATH=$(find . -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
